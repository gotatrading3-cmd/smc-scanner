name: GOTA Signaux

# Tourne dans le cloud GitHub (gratuit sur un depot public), PC eteint.
# Deux audiences : groupe VIP (tous les signaux, en detail) et groupe public (quelques signaux + animation).
# Publication reelle : variables SIGNALS_LIVE=true (VIP) et PUBLIC_LIVE=true (public). Sinon : apercu dans le chat prive.
# Les signaux en cours sont CHIFFRES dans la branche data (secret SIGNALS_STATE_KEY) et les journaux ne montrent ni paire ni niveaux.

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "scan = cycle normal | guides = guide VIP + accueil public epingles (modifie les messages epingles) | test = test vue abonnes | demo | brief | edu | cta | promo | account | recap | pinned = apercus"
        type: choice
        default: scan
        options: [scan, guides, test, demo, brief, edu, cta, promo, account, recap, pinned]

concurrency:
  group: gota-signals
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SIGNAL_BACKEND: yahoo
      SIGNALS_DATA_DIR: ${{ github.workspace }}/data
      PYTHONIOENCODING: utf-8
      SIGNALS_QUIET_LOG: "1"
      SIGNALS_STATE_KEY: ${{ secrets.SIGNALS_STATE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VIP_CHAT_ID: ${{ secrets.VIP_CHAT_ID }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      PRIVATE_LINK: ${{ secrets.PRIVATE_LINK }}
      CONTACT_LINK: ${{ vars.CONTACT_LINK }}
      ACCOUNT_LINK: ${{ vars.ACCOUNT_LINK }}
      SIGNALS_LIVE: ${{ vars.SIGNALS_LIVE }}
      PUBLIC_LIVE: ${{ vars.PUBLIC_LIVE }}
      PUBLIC_SIGNALS_PER_DAY: ${{ vars.PUBLIC_SIGNALS_PER_DAY }}
      SIGNALS_TF: ${{ vars.SIGNALS_TF }}
      SIGNALS_MIN_SCORE: ${{ vars.SIGNALS_MIN_SCORE }}
      SIGNALS_MAX_PER_DAY: ${{ vars.SIGNALS_MAX_PER_DAY }}
      SIGNALS_SYMBOLS: ${{ vars.SIGNALS_SYMBOLS }}
      SIGNALS_PAUSED: ${{ vars.SIGNALS_PAUSED }}
    steps:
      - uses: actions/checkout@v4

      - name: Donnees (branche data = historique public et auditable)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r requirements-cloud.txt

      - name: Executer
        env:
          ACTION: ${{ github.event.inputs.action || 'scan' }}
        run: |
          case "$ACTION" in
            guides) python signal_runner.py --post-pinned ;;
            test)   python signal_runner.py --test ;;
            demo)   python signal_runner.py --demo ;;
            brief)  python signal_runner.py --brief ;;
            edu)    python signal_runner.py --edu ;;
            cta)    python signal_runner.py --cta ;;
            promo)  python signal_runner.py --promo ;;
            account) python signal_runner.py --account ;;
            recap)  python signal_runner.py --recap ;;
            pinned) python signal_runner.py --pinned ;;
            *)      python signal_runner.py --once ;;
          esac

      - name: Sauvegarder l'etat et l'historique (commit horodate = piste d'audit publique)
        if: always()
        working-directory: data
        run: |
          git config user.name "gota-signals[bot]"
          git config user.email "gota-signals@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "etat $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin data
          fi

      - name: Garder le planificateur actif (GitHub coupe les cron apres 60 jours d'inactivite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable signals.yml || true
