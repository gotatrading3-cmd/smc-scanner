name: Sonde donnees

# Test ponctuel (supprime apres usage) : l'or et les indices US recales sur le prix du courtier fonctionnent-ils depuis GitHub ?
# Ne publie RIEN : aucun jeton Telegram n'est fourni a ce job.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIGNAL_BACKEND: yahoo
      SIGNALS_DATA_DIR: /tmp/probe_data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - name: Sonde
        run: |
          python - <<'EOF'
          import time, warnings
          warnings.filterwarnings("ignore")
          import pandas as pd
          import signal_data as sd
          from signal_engine import analyze, htf_bias
          print("heure UTC :", sd.utc_now())
          print("symboles disponibles :", len(sd.available_ids()), [i for i in sd.available_ids() if sd.UNIVERSE[i].get("anchor")])
          q = sd._spot_quote("XAU")
          print("prix de l'or au comptant (gold-api) :", q)
          for sid in ("XAUUSD", "US100", "US30", "US500", "EURUSD"):
              t0 = time.time()
              anchored = bool(sd.UNIVERSE[sid].get("anchor"))
              if anchored:
                  sd._update_basis(sid)
                  store = sd._basis_all().get(sid, {})
                  ks = sorted(store)
                  print(f"[{sid}] ecarts vrai prix - contrat a terme : {len(ks)} echantillons | premiers : {[(k[5:], store[k]) for k in ks[:2]]} | derniers : {[(k[5:], store[k]) for k in ks[-3:]]}")
              df1 = sd.get_rates(sid, "4h", 700)
              dfh = sd.get_rates(sid, "1d", 1000)
              if df1 is None or dfh is None:
                  print(f"[{sid}] DONNEES INDISPONIBLES (h4={None if df1 is None else len(df1)}, d1={None if dfh is None else len(dfh)})")
                  continue
              last = df1.iloc[-1]
              raw = sd._yf_fetch(sd.UNIVERSE[sid]["yahoo"], "1h", "730d")
              print(f"[{sid}] H4 : {len(df1)} bougies, D1 : {len(dfh)} | derniere bougie {df1.index[-1]} cloture {last['close']:.2f}"
                    + (f" (contrat a terme brut : {raw['close'].iloc[-1]:.2f})" if anchored else "") + f" | {time.time() - t0:.0f}s")
              meta = sd.symbol_meta(sid)
              bias = htf_bias(dfh, df1.index, 240, htf_minutes=1440)
              wl = []
              sigs = analyze(df1, bias, meta["point"], sid, sid, 240, sd.UNIVERSE[sid]["cls"], only_last=False, min_score=4, watch=wl)
              recent = [s for s in sigs if pd.Timestamp(s.bar_open) > df1.index[-1] - pd.Timedelta(days=30)]
              print(f"      moteur : {len(sigs)} signaux sur tout l'historique, {len(recent)} sur 30 jours ; dernier : "
                    f"{(recent[-1].direction + ' ' + str(recent[-1].bar_open) + ' entree ' + format(recent[-1].entry, '.2f') + ' stop ' + format(recent[-1].sl, '.2f')) if recent else 'aucun'}")
          # passage complet du vrai code de scan (sans aucune publication : pas de jeton Telegram ici)
          import signal_runner as sr
          cfg, st = sr.load_cfg(), sr.load_state()
          now = sd.utc_now()
          for sid in ("US100", "US30", "US500", "XAUUSD", "EURUSD"):
              try:
                  found = sr.scan_symbol(sid, sd.UNIVERSE[sid]["cls"], st, cfg, now)
                  print(f"[scan_symbol {sid}] signaux sur la derniere bougie : {len(found)} | derniere bougie notee : {st['last_bar'].get(sid)} | prochaine verification : {st['next_check'].get(sid)}")
              except Exception as e:
                  print(f"[scan_symbol {sid}] ERREUR {type(e).__name__}: {e}")
          EOF
