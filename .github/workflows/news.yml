name: GOTA Actus

# Le bot d'actualites du canal "Info du monde" tourne EN CONTINU chez GitHub, PC eteint.
# Meme principe que "GOTA Continu" (robot de signaux) mais totalement SEPARE : autre chaine, autre groupe de
# concurrence, autre branche d'etat (news-data) -> il ne peut pas perturber le robot de signaux.
# Un job dure ~5 h 40 : un cycle toutes les 60 secondes (lecture des flux, publication des nouveautes, calendrier),
# puis il relance le job suivant. Un filet de securite (cron) relance la chaine si elle s'arrete.
# Arret : variable NEWS_STOP=true, ou annuler l'execution en cours dans l'onglet Actions.
# Publication reelle dans le canal : variable NEWS_LIVE=true (sinon : apercu dans le chat prive du proprietaire).
# Le canal est en francais et sans aucun lien : les sources anglaises sont traduites par un modele libre (OPUS-MT, CC-BY 4.0)
# telecharge une fois puis garde en cache (news_models).

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Duree de ce job en minutes (defaut 340)"
        type: string
        default: "340"
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: gota-news-chain
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  actus:
    if: ${{ vars.NEWS_STOP != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONIOENCODING: utf-8
      NEWS_DATA_DIR: ${{ github.workspace }}/newsdata
      NEWS_CACHE_FILE: /tmp/news_cache.json
      NEWS_POSTED_FLAG: /tmp/news_posted.flag
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NEWS_CHAT_ID: ${{ secrets.NEWS_CHAT_ID }}
      NEWS_LIVE: ${{ vars.NEWS_LIVE }}
      NEWS_MODELS_DIR: ${{ github.workspace }}/news_models
      NEWS_MAX_PER_HOUR: ${{ vars.NEWS_MAX_PER_HOUR }}
      NEWS_MAX_PER_CYCLE: ${{ vars.NEWS_MAX_PER_CYCLE }}
    steps:
      - uses: actions/checkout@v4

      - name: "Etat (branche news-data = articles deja postes, evenements deja annonces)"
        uses: actions/checkout@v4
        with:
          ref: news-data
          path: newsdata

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-news.txt

      - run: pip install -r requirements-news.txt

      - name: "Modele de traduction (garde en cache apres le premier telechargement)"
        uses: actions/cache@v4
        with:
          path: news_models
          key: news-models-opus-tc-big-en-fr-v1

      - name: "Telecharger le modele de traduction s'il manque"
        run: |
          # sans modele, les articles anglais sont simplement ignores (le canal reste 100 % francais)
          python news_translate.py --ensure || echo "modele de traduction indisponible pour le moment"

      - name: Boucle (un cycle par minute)
        env:
          MINUTES: ${{ github.event.inputs.minutes || '340' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C newsdata config user.name "gota-news[bot]"
          git -C newsdata config user.email "gota-news@users.noreply.github.com"

          # Surveillance croisee : si la chaine voisine (signaux) est morte - aucune execution en cours ni en attente, et sa derniere
          # execution s'est terminee en succes ou en echec (une ANNULATION = arret voulu, on n'y touche pas) - on la relance.
          watch_chain() {
            local wf="$1" n last
            n=$(gh run list --workflow="$wf" --repo "$GITHUB_REPOSITORY" --limit 6 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null) || return 0
            [ "$n" = "0" ] || return 0
            sleep 40
            n=$(gh run list --workflow="$wf" --repo "$GITHUB_REPOSITORY" --limit 6 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null) || return 0
            [ "$n" = "0" ] || return 0
            last=$(gh run list --workflow="$wf" --repo "$GITHUB_REPOSITORY" --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null) || return 0
            case "$last" in
              success|failure|timed_out)
                echo "chaine $wf arretee ($last) : relance"
                gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" || true ;;
            esac
            return 0
          }

          save_state() {
            # une seule validation sur la branche (historique inutile ici) : on la reecrit a chaque sauvegarde
            ( cd newsdata
              git add -A
              if ! git diff --cached --quiet; then
                git commit -q --amend -m "etat actus $(date -u +%Y-%m-%dT%H:%MZ)"
                for I in 1 2 3; do
                  if git push -q --force origin news-data; then break; fi
                  sleep 3
                done
              fi )
          }

          END=$(( $(date +%s) + MINUTES * 60 ))
          LAST_SAVE=$(date +%s)
          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            T0=$(date +%s)
            N=$((N + 1))
            timeout 90 python news_runner.py --once || echo "cycle $N : erreur ou delai depasse"
            # on enregistre l'etat des qu'un message est parti (jamais de doublon apres un incident), sinon toutes les 10 min
            if [ -f "$NEWS_POSTED_FLAG" ] || [ $(( $(date +%s) - LAST_SAVE )) -ge 600 ]; then
              rm -f "$NEWS_POSTED_FLAG"
              save_state || echo "sauvegarde de l'etat impossible ce coup-ci (on continue)"
              LAST_SAVE=$(date +%s)
            fi
            if [ $(( N % 10 )) -eq 0 ]; then watch_chain continu.yml || true; fi
            WAIT=$(( T0 + 60 - $(date +%s) ))
            if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          done
          save_state || echo "sauvegarde finale de l'etat impossible"
          echo "Fin de la boucle apres $N cycles"

      - name: Relancer la chaine (job suivant)
        if: ${{ !cancelled() && vars.NEWS_STOP != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news.yml --repo "$GITHUB_REPOSITORY"
